name: Release - Publish Multi-Arch Image & Sign with Cosign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign OIDC Keyless Signing

jobs:
  build-and-publish:
    name: Build, Publish & Sign Multi-Arch Variants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Setup Apko
        run: |
          set -euxo pipefail
          APKO_VERSION="1.5.1"
          curl -sL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 "apko_${APKO_VERSION}_linux_amd64/apko"
          apko version

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Metadata
        id: meta
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LOWER}/java21-distroless" >> "$GITHUB_OUTPUT"

      - name: Generate Melange Signing Key
        run: |
          melange keygen melange.rsa

      - name: Multi-Arch Build Custom JRE Packages
        run: |
          for ARCH in x86_64 aarch64; do
            echo "Building APK for ${ARCH}..."
            melange build melange/melange.yaml \
              --arch "${ARCH}" \
              --signing-key melange.rsa \
              --out-dir packages
          done

      # ------------------------------------------------------------------------
      # 1. Publish Variant 1: Production (latest / prod / vX.Y.Z)
      # ------------------------------------------------------------------------
      - name: Publish Multi-Arch Production Image (latest/prod)
        run: |
          BASE_IMG="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          
          apko publish apko/apko-prod.yaml \
            "${BASE_IMG}:${TAG}" \
            "${BASE_IMG}:prod" \
            "${BASE_IMG}:latest" \
            --arch x86_64,aarch64 \
            --keyring-append melange.rsa.pub \
            --sbom-formats spdx-json

          cosign sign --yes "${BASE_IMG}:${TAG}"
          cosign sign --yes "${BASE_IMG}:prod"
          cosign sign --yes "${BASE_IMG}:latest"

      # ------------------------------------------------------------------------
      # 2. Publish Variant 2: Debug (dev / debug / vX.Y.Z-debug)
      # ------------------------------------------------------------------------
      - name: Publish Multi-Arch Debug Image (dev/debug)
        run: |
          BASE_IMG="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"

          apko publish apko/apko-debug.yaml \
            "${BASE_IMG}:${TAG}-debug" \
            "${BASE_IMG}:debug" \
            "${BASE_IMG}:dev" \
            --arch x86_64,aarch64 \
            --keyring-append melange.rsa.pub \
            --sbom-formats spdx-json

          cosign sign --yes "${BASE_IMG}:${TAG}-debug"
          cosign sign --yes "${BASE_IMG}:debug"
          cosign sign --yes "${BASE_IMG}:dev"

      # ------------------------------------------------------------------------
      # 3. Publish Variant 3: Build (build / vX.Y.Z-build)
      # ------------------------------------------------------------------------
      - name: Publish Multi-Arch Build Image (build)
        run: |
          BASE_IMG="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"

          apko publish apko/apko-build.yaml \
            "${BASE_IMG}:${TAG}-build" \
            "${BASE_IMG}:build" \
            --arch x86_64,aarch64 \
            --sbom-formats spdx-json

          cosign sign --yes "${BASE_IMG}:${TAG}-build"
          cosign sign --yes "${BASE_IMG}:build"

      # ------------------------------------------------------------------------
      # Attest SBOMs
      # ------------------------------------------------------------------------
      - name: Attest SBOMs with Cosign
        run: |
          BASE_IMG="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          for SBOM in $(find . -maxdepth 2 -name "*.spdx.json"); do
            echo "Attesting SBOM ${SBOM}..."
            cosign attest --yes --predicate "${SBOM}" --type spdx "${BASE_IMG}:${TAG}" || true
          done

name: Release - Publish Multi-Arch Image & Sign with Cosign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign OIDC Keyless Signing

jobs:
  build-and-publish:
    name: Build, Publish & Cosign Attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Setup Apko
        run: |
          set -euxo pipefail
          APKO_VERSION="1.5.1"
          curl -sL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 "apko_${APKO_VERSION}_linux_amd64/apko"
          apko version

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Metadata
        id: meta
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/java21-distroless" >> "$GITHUB_OUTPUT"

      - name: Generate Melange Signing Key
        run: |
          melange keygen melange.rsa

      - name: Multi-Arch Build Custom JRE Packages
        run: |
          for ARCH in x86_64 aarch64; do
            echo "Building APK for ${ARCH}..."
            melange build melange/melange.yaml \
              --arch "${ARCH}" \
              --signing-key melange.rsa \
              --out-dir packages
          done

      - name: Publish Multi-Arch Image to GHCR using Apko
        id: apko-publish
        run: |
          IMAGE_URI="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          LATEST_URI="${{ steps.meta.outputs.image }}:latest"

          DIGEST=$(apko publish apko/apko.yaml \
            "${IMAGE_URI}" \
            "${LATEST_URI}" \
            --arch x86_64,aarch64 \
            --keyring-append melange.rsa.pub \
            --sbom-formats spdx-json)
          
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign Container Image with Cosign (Keyless via GitHub OIDC)
        run: |
          IMAGE_URI="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo "Signing ${IMAGE_URI}..."
          cosign sign --yes "${IMAGE_URI}"

      - name: Attest SBOM with Cosign
        run: |
          IMAGE_URI="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo "Attesting SBOM for ${IMAGE_URI}..."
          # Locate generated SBOM from apko output
          SBOM_FILE=$(find . -name "*.spdx.json" | head -n 1)
          if [ -f "${SBOM_FILE}" ]; then
            cosign attest --yes --predicate "${SBOM_FILE}" --type spdx "${IMAGE_URI}"
          fi
